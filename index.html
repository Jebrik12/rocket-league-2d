    <script>
      (function() {
        function showRecoveryUI(reason) {
          if (document.getElementById('mobile-recovery-banner')) return;
          var root = document.getElementById('root');
          if (root && root.children && root.children.length > 0) return;
          var banner = document.createElement('div');
          banner.id = 'mobile-recovery-banner';
          banner.style.cssText = 'position:fixed;inset:0;background:#020617;z-index:999999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;color:#f8fafc;font-family:sans-serif;text-align:center;box-sizing:border-box;';
          banner.innerHTML = '<div style="background:#0f172a;border:1px solid #f59e0b;border-radius:18px;padding:24px;max-width:340px;width:100%;box-shadow:0 25px 50px -12px rgba(0,0,0,0.6);">' +
            '<div style="font-size:36px;margin-bottom:8px;">⚡</div>' +
            '<h2 style="font-size:18px;font-weight:800;margin:0 0 8px;color:#fbbf24;letter-spacing:0.02em;">Rocket League 2D</h2>' +
            '<p style="font-size:13px;color:#94a3b8;margin:0 0 16px;line-height:1.4;">A new version is available! Tap below to update and start the game.</p>' +
            '<button id="recovery-reload-btn" style="width:100%;padding:14px 18px;background:linear-gradient(to right, #0284c7, #2563eb);color:white;font-weight:bold;border:none;border-radius:12px;font-size:15px;cursor:pointer;box-shadow:0 4px 14px rgba(2,132,199,0.4);">Update & Play Now</button>' +
            (reason ? '<p style="margin-top:14px;font-size:10px;color:#64748b;font-family:monospace;word-break:break-all;">' + reason + '</p>' : '') +
            '</div>';
          document.body.appendChild(banner);
          var btn = document.getElementById('recovery-reload-btn');
          if (btn) {
            btn.addEventListener('click', function() {
              try {
                if ('caches' in window) {
                  caches.keys().then(function(names) {
                    names.forEach(function(name) { caches.delete(name); });
                  });
                }
                sessionStorage.clear();
              } catch (e) {}
              window.location.replace(window.location.origin + window.location.pathname + '?v=' + Date.now());
            });
          }
        }

        window.addEventListener('error', function(e) {
          showRecoveryUI(e && e.message ? e.message : 'Loading error');
        });

        window.addEventListener('unhandledrejection', function(e) {
          showRecoveryUI(e && e.reason && e.reason.message ? e.reason.message : 'Rejection error');
        });

        setTimeout(function() {
          showRecoveryUI('Tap to load latest version');
        }, 3000);
      })();
    </script>
